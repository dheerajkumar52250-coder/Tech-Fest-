    <form>
    <h2>Fill the form to watch at your nearest IMAX</h2>

    <fieldset>
        <label for="name">Name:</label>
        <input type="text" placeholder="Enter Your Name" id="name"><br>

        <label for="email">Email:</label>
        <input type="email" placeholder="Enter Your Email" id="email"><br>

        <label for="tel">Mobile no.:</label>
        <input type="tel" placeholder="Enter Your Mobile no." id="tel"><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob"><br>

        <label for="address">Address</label>
        <textarea name="Address" id="address"></textarea><br>

        <p>Select your gender:</p>

        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label><br>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br>

        <input type="submit" value="Submit"></fieldset>
    </form>
